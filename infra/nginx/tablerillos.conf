# nginx de producción: sirve el SPA compilado y proxy /api → backend.
# Único punto de entrada del stack (docker-compose.prod.yml lo monta como
# default.conf). TLS lo termina el proxy institucional aguas arriba, que debe
# enviar X-Forwarded-Proto: https.

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API del backend (BFF): same-origin, la cookie tb_session viaja sin CORS.
    # Sin URI en el proxy_pass → conserva el prefijo /api tal como monta main.py.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check del backend a través del puerto único.
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Assets de Vite: nombres con hash → cacheables para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA: cualquier ruta interna de React Router sirve index.html.
    location / {
        try_files $uri /index.html;
    }
}
