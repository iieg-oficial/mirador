# =====================================================================
# Tablerillos — docker-compose (desarrollo)
# ---------------------------------------------------------------------
# Servicios: postgres (PostGIS), redis, backend (FastAPI), frontend (Vite).
# Minerva NO está aquí: corre en el host (localhost:9000). Los contenedores
# lo alcanzan vía host.docker.internal (ver extra_hosts en backend).
#
# Uso:   docker compose -f infra/docker-compose.yml up --build
# Las variables se leen del archivo .env en la raíz del repo.
# =====================================================================

name: tablerillos

services:
  postgres:
    # PostGIS disponible aunque la geometría municipal sea opcional en MVP1.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tablerillos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tablerillos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tablerillos} -d ${POSTGRES_DB:-tablerillos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      # PAT para instalar el minerva-sdk (repo privado). Se toma de GITHUB_TOKEN
      # del .env; si está vacío, el build cae al set base (modo stub).
      secrets:
        - github_token
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tablerillos}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-tablerillos}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Permite que el backend alcance Minerva corriendo en el host (Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data:
  redis_data:

# Secreto de build con el PAT de GitHub para instalar el minerva-sdk privado.
# Su valor se lee de la variable GITHUB_TOKEN del .env (puede ir vacío en dev).
secrets:
  github_token:
    environment: GITHUB_TOKEN
