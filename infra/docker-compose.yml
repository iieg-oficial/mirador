# =====================================================================
# Tablerillos — docker-compose (desarrollo)
# ---------------------------------------------------------------------
# Servicios: postgres (PostGIS), redis, backend (FastAPI), frontend (Vite).
# Minerva NO está aquí: corre en el host (localhost:9000). Los contenedores
# lo alcanzan vía host.docker.internal (ver extra_hosts en backend).
#
# Uso:   docker compose -f infra/docker-compose.yml up --build
# Las variables se leen del archivo .env en la raíz del repo.
# =====================================================================

name: tablerillos

services:
  postgres:
    # PostGIS disponible aunque la geometría municipal sea opcional en MVP1.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tablerillos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tablerillos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tablerillos} -d ${POSTGRES_DB:-tablerillos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Default 6380 en el host para no chocar con el Redis local de Minerva
      # (6379). Dentro de compose el backend siempre usa redis:6379.
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      # PAT para instalar el minerva-sdk (repo privado, dependencia OBLIGATORIA).
      # Se toma de GITHUB_TOKEN del ENTORNO del shell (no del .env): exporta antes
      # de construir con  set -a && . ./.env && set +a. Si va vacío el build falla.
      secrets:
        - github_token
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tablerillos}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-tablerillos}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Permite que el backend alcance Minerva corriendo en el host (Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/app
    command: >
      bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      # Dentro de compose el proxy de Vite debe apuntar al servicio backend,
      # no a localhost (que dentro del contenedor es el propio frontend).
      VITE_BACKEND_URL: "http://backend:8000"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data:
  redis_data:

# Secreto de build con el PAT de GitHub para instalar el minerva-sdk privado
# (obligatorio). Su valor se lee de la variable de entorno GITHUB_TOKEN del shell
# (no del .env): expórtala antes de construir. El build falla si va vacía.
secrets:
  github_token:
    environment: GITHUB_TOKEN
