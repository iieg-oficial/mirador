# =====================================================================
# Tablerillos — docker-compose de PRODUCCIÓN
# ---------------------------------------------------------------------
# Diferencias vs. el compose de desarrollo:
#   - frontend: build estático servido por nginx (target prod), que además
#     hace proxy de /api al backend → único puerto expuesto del stack.
#   - backend: uvicorn multi-worker sin --reload, sin bind mounts, sin
#     puerto publicado (solo accesible vía nginx).
#   - postgres/redis: solo en la red interna (sin ports).
#   - TLS: lo termina el proxy institucional aguas arriba (ver
#     docs/deployment.md); este nginx escucha HTTP plano.
#
# Uso:
#   set -a && . ./.env && set +a          # exporta GITHUB_TOKEN al shell
#   docker compose -f infra/docker-compose.prod.yml up -d --build
# =====================================================================

name: tablerillos-prod

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tablerillos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-tablerillos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tablerillos} -d ${POSTGRES_DB:-tablerillos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      secrets:
        - github_token
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tablerillos}:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-tablerillos}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # --proxy-headers: siempre corre detrás del nginx del stack (y del proxy
    # institucional), para que request.url refleje el esquema/host reales.
    command: >
      bash -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers 4 --proxy-headers --forwarded-allow-ips '*'"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: prod
    volumes:
      - ./nginx/tablerillos.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

secrets:
  github_token:
    environment: GITHUB_TOKEN
