[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "tablerillos-backend"
version = "0.2.0"
description = "Backend FastAPI de Tablerillos — BI institucional del IIEG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.28",
    "cryptography>=44.0",      # cifrado Fernet de credenciales de conexión
    "sqlglot>=25.0",          # parser SQL para validación SELECT-only
    "python-multipart>=0.0.12",
    # IA: generación asistida de SQL/ChartSpec. Solo el core + el binding OpenAI
    # (no el meta-paquete `langchain` ni `deepagents`). Versión congelada: la
    # firma de ChatOpenAI cambia entre releases (ver ai/provider.py).
    "langchain-core==1.4.9",
    "langchain-openai==1.3.4",
    # SDK de Minerva: OBLIGATORIO. Minerva es la única fuente de identidad y
    # autorización. Repo privado: requiere un PAT (GITHUB_TOKEN) para instalar
    # (en Docker se pasa como secreto de BuildKit; ver Dockerfile).
    "minerva-sdk @ git+https://github.com/iieg-oficial/minerva.git@v0.1.0#subdirectory=sdk",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",   # httpx (TestClient) ya viene en deps base
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
# El minerva-sdk se importa de forma perezosa y puede no estar instalado en el
# entorno local de type-check (repo privado). No debe hacer fallar a mypy.
[[tool.mypy.overrides]]
module = ["minerva_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
