[project]
name = "tablerillos-backend"
version = "0.1.0"
description = "Backend FastAPI de Tablerillos — BI institucional del IIEG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.28",
    "cryptography>=44.0",      # cifrado Fernet de credenciales de conexión
    "sqlglot>=25.0",          # parser SQL para validación SELECT-only
    "python-multipart>=0.0.12",
    # minerva_sdk se instala aparte (editable o como dependencia publicada):
    #   pip install -e path/to/minerva/sdk
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
